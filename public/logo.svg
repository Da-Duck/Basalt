<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <!-- Градиенты солнечной и тёмной охры -->
    <linearGradient id="g-apex" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="g-ochre-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="45%" stop-color="#e5a93c" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="g-ochre-dark" x1="0%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="60%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="g-core" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#2c2217" />
      <stop offset="100%" stop-color="#14110e" />
    </linearGradient>

    <!-- Градиенты вулканического базальта -->
    <linearGradient id="g-top-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d465c" />
      <stop offset="100%" stop-color="#232836" />
    </linearGradient>

    <linearGradient id="g-column" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3446" />
      <stop offset="100%" stop-color="#1b202c" />
    </linearGradient>

    <linearGradient id="g-mid-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242a38" />
      <stop offset="100%" stop-color="#161a23" />
    </linearGradient>

    <linearGradient id="g-flank" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1e29" />
      <stop offset="100%" stop-color="#10131a" />
    </linearGradient>

    <linearGradient id="g-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151821" />
      <stop offset="100%" stop-color="#090b0e" />
    </linearGradient>
  </defs>

  <!-- Грани кристалла базальта (Геометрия монолита) -->
  <!-- 1. Верхний левый скол (Базальт на свету) -->
  <polygon points="128,22 126,92 78,62" fill="url(#g-top-left)" />

  <!-- 2. Верхний правый скол (Золотистый пик) -->
  <polygon points="128,22 194,70 126,92" fill="url(#g-apex)" />

  <!-- 3. Главная правая грань (Насыщенный охровый массив) -->
  <polygon points="126,92 194,70 212,138 142,150" fill="url(#g-ochre-main)" />

  <!-- 4. Нижняя правая грань (Тёмная охра / бронза) -->
  <polygon points="142,150 212,138 176,202 130,236" fill="url(#g-ochre-dark)" />

  <!-- 5. Средняя нижняя грань (Переходное ядро породы) -->
  <polygon points="142,150 130,236 110,174" fill="url(#g-core)" />

  <!-- 6. Левая нижняя грань (Глубокая базальтовая тень) -->
  <polygon points="110,174 130,236 68,190" fill="url(#g-shadow)" />

  <!-- 7. Нижний левый скол (Боковой базальт) -->
  <polygon points="110,174 68,190 54,126" fill="url(#g-flank)" />

  <!-- 8. Средний левый скол -->
  <polygon points="78,62 110,174 54,126" fill="url(#g-mid-left)" />

  <!-- 9. Центральная колонна (Тёмная базальтовая структура) -->
  <polygon points="126,92 142,150 110,174 78,62" fill="url(#g-column)" />

  <!-- Тонкие световые ребра граней кристалла -->
  <line x1="128" y1="22" x2="126" y2="92" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round" opacity="0.85" />
  <line x1="126" y1="92" x2="142" y2="150" stroke="#fde68a" stroke-width="1.2" stroke-linecap="round" opacity="0.75" />
  <line x1="142" y1="150" x2="130" y2="236" stroke="#d97706" stroke-width="1" stroke-linecap="round" opacity="0.6" />
  <line x1="126" y1="92" x2="194" y2="70" stroke="#fffbeb" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />
  <line x1="142" y1="150" x2="212" y2="138" stroke="#fbbf24" stroke-width="1" stroke-linecap="round" opacity="0.5" />
  <line x1="126" y1="92" x2="78" y2="62" stroke="#64748b" stroke-width="0.8" stroke-linecap="round" opacity="0.4" />
</svg>
